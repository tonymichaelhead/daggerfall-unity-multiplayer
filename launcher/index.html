<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFMP Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="frame">
      <main class="shell">
        <header class="brand">
          <div class="brand-star" aria-hidden="true"></div>
          <h1 class="brand-title">Daggerfall Unity</h1>
          <p class="brand-sub">Multiplayer</p>
        </header>

        <div class="rule"></div>

        <section id="login-panel" class="panel">
          <h2>Sign in</h2>
          <p class="hint">
            Your username and password are used on every DFMP server. Your password is never sent to a
            server; only a value derived from it leaves this machine.
          </p>

          <div class="field">
            <label for="account">Username</label>
            <div class="control">
              <span class="icon icon-user" aria-hidden="true"></span>
              <input id="account" type="text" autocomplete="username" spellcheck="false" />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <span class="icon icon-lock" aria-hidden="true"></span>
              <input id="password" type="password" autocomplete="current-password" />
            </div>
          </div>

          <label class="checkbox">
            <input id="remember" type="checkbox" checked />
            <span class="box" aria-hidden="true"></span>
            <span class="checkbox-text">Remember me on this computer</span>
          </label>

          <button id="sign-in" type="button" class="primary">Sign in</button>
        </section>

        <section id="main-panel" class="panel" hidden>
          <h2>Ready to play</h2>
          <p class="hint">Signed in as <strong id="signed-in-account"></strong></p>

          <div class="field-row">
            <div class="field-text">
              <span class="field-label">Daggerfall game files</span>
              <span id="daggerfall-path" class="field-value">Not set</span>
            </div>
            <button id="browse-daggerfall" type="button" class="secondary">Change</button>
          </div>

          <div class="field-row">
            <div class="field-text">
              <span class="field-label">DFMP client</span>
              <span id="client-path" class="field-value">Not set</span>
            </div>
            <button id="browse-client" type="button" class="secondary">Change</button>
          </div>

          <button id="play" type="button" class="primary">Play</button>
          <button id="sign-out" type="button" class="link">Sign out</button>
        </section>

        <div class="footnote">
          <p id="status" class="status" role="status"></p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
