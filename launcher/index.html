<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFMP Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="frame">
      <main class="shell">
        <header class="brand">
          <div class="brand-star" aria-hidden="true"></div>
          <h1 class="brand-title">Daggerfall Unity</h1>
          <p class="brand-sub">Multiplayer</p>
        </header>

        <div class="rule"></div>

        <section id="main-panel" class="panel">
          <div class="panel-top">
            <h2>Ready to play</h2>
            <p class="hint">
              Servers authenticate you with Discord when you connect. This launcher only stores local
              settings.
            </p>

            <div class="field-row">
              <div class="field-text">
                <span class="field-label">Daggerfall game files</span>
                <span id="daggerfall-path" class="field-value">Not set</span>
              </div>
              <button id="browse-daggerfall" type="button" class="secondary">Change</button>
            </div>
          </div>

          <div class="panel-actions">
            <button id="play" type="button" class="primary">Play</button>
          </div>
        </section>

        <div class="footnote">
          <p id="status" class="status" role="status"></p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
